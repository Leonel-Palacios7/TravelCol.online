name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  calidad:
    name: Lint, tipos, pruebas y build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: travelcol
          POSTGRES_PASSWORD: travelcol_ci
          POSTGRES_DB: travelcol_ci_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U travelcol" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # Base exclusiva del job (efímera). Las pruebas de integración crean y eliminan su propia base.
      DATABASE_URL: postgresql://travelcol:travelcol_ci@localhost:5432/travelcol_ci_test
      TEST_DATABASE_SERVER_URL: postgresql://travelcol:travelcol_ci@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.0 }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @travelcol/contracts build
      - run: pnpm --filter @travelcol/api exec prisma generate
      - name: Lint
        run: pnpm lint
      - name: Tipos
        run: pnpm typecheck
      - name: Pruebas unitarias y de contratos
        run: |
          pnpm --filter @travelcol/contracts test
          pnpm --filter @travelcol/api test:unit
      - name: Pruebas de integración (API + PostgreSQL)
        run: pnpm --filter @travelcol/api test:integration
      - name: Build
        run: pnpm build
      - name: Auditoría de dependencias (informativa)
        run: pnpm audit --prod --audit-level high || echo "::warning::Revisar hallazgos de pnpm audit"
      - uses: actions/upload-artifact@v7
        with:
          name: builds
          retention-days: 3
          include-hidden-files: true
          path: |
            apps/api/dist
            apps/api/dist-seed
            apps/web/.next
            packages/contracts/dist
            !apps/web/.next/cache

  e2e:
    name: E2E (Playwright)
    needs: calidad
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: travelcol
          POSTGRES_PASSWORD: travelcol_ci
          POSTGRES_DB: travelcol_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U travelcol" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://travelcol:travelcol_ci@localhost:5432/travelcol_e2e
      CI: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.0 }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with: { name: builds }
      - run: pnpm --filter @travelcol/api exec prisma generate
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Base E2E (migraciones + semilla demo)
        run: ./scripts/prepare-e2e-db.sh
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  imagenes:
    name: Imágenes Docker
    needs: calidad
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: API
        run: docker build -f infrastructure/docker/api.Dockerfile -t travelcol-api:${{ github.sha }} .
      - name: Web
        run: docker build -f infrastructure/docker/web.Dockerfile --build-arg API_INTERNAL_URL=http://api:4000 -t travelcol-web:${{ github.sha }} .
