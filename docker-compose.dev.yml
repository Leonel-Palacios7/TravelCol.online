# Solo para desarrollo local: PostgreSQL 16. La API y la web se ejecutan con pnpm dev.
#   docker compose -f docker-compose.dev.yml up -d
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: travelcol
      POSTGRES_PASSWORD: travelcol_dev
      POSTGRES_DB: travelcol_dev
    ports: ["5432:5432"]
    volumes: [pgdata-dev:/var/lib/postgresql/data]
volumes:
  pgdata-dev:
